name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run tests
        run: go test -v -race -short ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w \
            -X github.com/prady-lab/sgh-cli/cmd/version.Version=${VERSION} \
            -X github.com/prady-lab/sgh-cli/cmd/version.CommitSHA=${COMMIT} \
            -X github.com/prady-lab/sgh-cli/cmd/version.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/sgh-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/sgh-linux-arm64 .

          # macOS
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/sgh-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/sgh-darwin-arm64 .

          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/sgh-windows-amd64.exe .

          # Create checksums
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
